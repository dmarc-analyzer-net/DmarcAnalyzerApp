# CI: test everything on every push/PR; publish the container image on main
# (`latest` + `sha-…`) and on version tags (`vX.Y.Z` → semver tags).
#
# The published image is the single-image runtime (APP_MODE=api|worker) that the
# README quick-start and the marketing site's "Get started" flow point at.
#
# Two registries, one build:
#   ghcr.io/dmarc-analyzer-net/dmarc-analyzer  — canonical (no pull rate limits,
#                                                zero setup, what the README uses)
#   dmarcanalyzernet/dmarc-analyzer            — Docker Hub mirror for discovery
#
# The Docker Hub push is skipped automatically unless DOCKERHUB_USERNAME and
# DOCKERHUB_TOKEN are set as repository secrets, so this workflow works as-is.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/dmarc-analyzer
  DOCKERHUB_IMAGE: dmarcanalyzernet/dmarc-analyzer

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: API tests
        run: dotnet test src/api.tests/DmarcAnalyzer.Api.Tests.csproj --nologo

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Frontend type-check + build
        working-directory: src/web
        run: |
          npm ci
          npx tsc --noEmit
          npm run build

  publish:
    # Publish only from main and version tags — never from PRs (no secrets there).
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (arm64 builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub is optional: mirror there only once the secrets exist, so the
      # workflow never fails on a repo that hasn't set them up.
      - name: Check for Docker Hub credentials
        id: dockerhub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docker Hub secrets not set — publishing to GHCR only."
          fi

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata (tags + OCI labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            name=${{ env.IMAGE }}
            name=${{ env.DOCKERHUB_IMAGE }},enable=${{ steps.dockerhub.outputs.enabled }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # One build, pushed to every tag metadata-action produced — which spans
      # both registries when Docker Hub is enabled.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
