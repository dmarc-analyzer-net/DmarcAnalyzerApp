# CI: test everything on every push/PR, and build the container image.
#
# Release channels — `latest` tracks releases, never bleeding-edge `main`, because
# the README quick-start pulls `latest` and a fresh install must be reproducible:
#
#   tag vX.Y.Z    ->  latest, X.Y.Z, X.Y, sha-<commit>   (the stable channel)
#   push main     ->  edge, sha-<commit>                 (tracks development)
#   pull request  ->  build only, never pushed           (proves the Dockerfile)
#
# Documentation-only pushes to `main` skip the image entirely. Release tags and
# pull requests always build it, so a doc filter can never suppress a release or
# hide a broken Dockerfile.
#
# The published image is the single-image runtime (APP_MODE=api|worker) that the
# README quick-start and the marketing site's "Get started" flow point at.
#
# Two registries, one build:
#   ghcr.io/dmarc-analyzer-net/dmarc-analyzer  — canonical (no pull rate limits,
#                                                zero setup, what the README uses)
#   dmarcanalyzernet/dmarc-analyzer            — Docker Hub mirror for discovery
#
# The Docker Hub push is skipped automatically unless DOCKERHUB_TOKEN is set as a
# repository secret, so this workflow works as-is.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/dmarc-analyzer
  DOCKERHUB_IMAGE: dmarcanalyzernet/dmarc-analyzer

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: API tests
        run: dotnet test src/api.tests/DmarcAnalyzer.Api.Tests.csproj --nologo

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Frontend type-check + build
        working-directory: src/web
        run: |
          npm ci
          npx tsc --noEmit
          npm run build

  changes:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.decide.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Decide whether an image is needed
        id: decide
        run: |
          # A release tag must always produce an image, and a pull request must
          # always prove the Dockerfile still builds — never filter those.
          if [ "${{ github.ref_type }}" = "tag" ] || [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "image=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # For a push to main, build only when something outside documentation
          # changed. If the diff can't be computed, err toward building.
          #
          # Counted with a positive pattern rather than `grep -qv`: the exit-code
          # semantics of -q combined with -v differ between grep implementations,
          # and this comparison behaves identically everywhere.
          changed="$(git diff --name-only HEAD^ HEAD 2>/dev/null || true)"
          total=$(printf '%s\n' "$changed" | grep -c . || true)
          docs=$(printf '%s\n' "$changed" | grep -cE '^(docs/|LICENSE\.txt$|.*\.md$)' || true)
          echo "changed=$total docs=$docs"
          if [ "${total:-0}" -eq 0 ] || [ "${docs:-0}" -lt "${total:-0}" ]; then
            echo "image=true" >> "$GITHUB_OUTPUT"
          else
            echo "image=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Documentation-only change — skipping the container image."
          fi

  image:
    needs: [test, changes]
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (arm64 builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub is optional: mirror there only once the token exists, so the
      # workflow never fails on a repo that hasn't set it up. Only the token is a
      # secret — the account name comes from the DOCKERHUB_USERNAME repository
      # *variable*, falling back to the namespace owner in DOCKERHUB_IMAGE.
      - name: Check for Docker Hub credentials
        id: dockerhub
        if: github.event_name != 'pull_request'
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKERHUB_TOKEN not set — publishing to GHCR only."
          fi

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || 'dmarcanalyzernet' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata (tags + OCI labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          # On a pull request the Docker Hub step is skipped, so its output is
          # empty — fall back to false rather than emitting an invalid enable=.
          images: |
            name=${{ env.IMAGE }}
            name=${{ env.DOCKERHUB_IMAGE }},enable=${{ steps.dockerhub.outputs.enabled || 'false' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,prefix=sha-

      # One build, pushed to every tag metadata-action produced — which spans both
      # registries when Docker Hub is enabled. Pull requests build without pushing.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
