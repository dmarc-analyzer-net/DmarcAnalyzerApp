# Render Blueprint — one-click deploy via the "Deploy to Render" button in
# the README. Provisions the app (single container, APP_MODE=all) and a
# managed Postgres database, and wires them together automatically.
#
# Render's managed Postgres exposes its connection details as a
# postgresql://user:password@host:port/database URI (over Render's private
# network), which DATABASE_URL accepts directly — the app converts it to
# Npgsql's ADO.NET format internally. No manual paste step needed.
#
# Security__CredentialEncryptionKey is generated for you (base64, 256-bit —
# matches `openssl rand -base64 32`). Keep it: losing it makes every stored
# mailbox credential undecryptable.

databases:
  - name: dmarc-analyzer-db
    databaseName: dmarc_analyzer
    plan: free
    postgresMajorVersion: "18"

services:
  - name: dmarc-analyzer
    type: web
    runtime: image
    image:
      url: ghcr.io/dmarc-analyzer-net/dmarc-analyzer:latest
    plan: free
    healthCheckPath: /api/v1/auth/setup
    envVars:
      - key: APP_MODE
        value: all
      - key: Database__MigrateOnStartup
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: dmarc-analyzer-db
          property: connectionString
      - key: Security__CredentialEncryptionKey
        generateValue: true
