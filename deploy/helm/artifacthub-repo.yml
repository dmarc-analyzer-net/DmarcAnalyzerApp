# Artifact Hub repository metadata.
#
# Its only job is the "Verified publisher" badge: Artifact Hub compares the
# repositoryID below against the repository it has registered, and if they match
# it accepts that whoever publishes the chart controls the listing.
#
# It is NOT read from this git repository. For an OCI-hosted chart repo it has to
# be pushed as an artifact to the same OCI namespace — see
# docs/ops/release.md#listing-it-on-artifact-hub.
#
# There is no `owners` section here on purpose. That field belongs to a different
# flow — claiming a repository somebody *else* added — and is not needed when you
# registered it yourself.

