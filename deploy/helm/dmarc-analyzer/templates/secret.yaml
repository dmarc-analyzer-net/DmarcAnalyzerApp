{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dmarc.fullname" . }}-secrets
  labels:
    {{- include "dmarc.labels" . | nindent 4 }}
  annotations:
    # Created ahead of the migration Job, which is itself a pre-install hook and
    # would otherwise start before this Secret exists. Not deleted afterwards, so
    # the ordinary Deployments can go on reading it.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  encryption-key: {{ required "auth.encryptionKey is required unless auth.existingSecret is set" .Values.auth.encryptionKey | quote }}
  db-password: {{ (ternary .Values.postgres.password .Values.externalDatabase.password .Values.postgres.enabled) | quote }}
{{- end }}
