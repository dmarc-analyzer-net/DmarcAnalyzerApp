{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dmarc.serviceAccountName" . }}
  labels:
    {{- include "dmarc.labels" . | nindent 4 }}
  annotations:
    # Created as a hook, ahead of the migration Job, for the same reason the
    # Secret is: hooks run before ordinary resources, so a pre-install Job that
    # names this account would be rejected outright — "error looking up service
    # account" — and never get as far as creating a pod.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
