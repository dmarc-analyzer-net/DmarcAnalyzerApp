# Render Blueprint — one-click deploy via the "Deploy to Render" button in
# the README. Provisions the app (single container, APP_MODE=all) and a
# managed Postgres database, and wires them together automatically via
# DATABASE_URL (see docs/ops/configuration.md).
#
# The image tag is pinned, not `latest`. Render's sync only reacts to a
# change committed to this file — never to a new push to a tag it already
# references — so `latest` here would mean this deploy never updates itself.
# Bump the tag with every release (VersionReferenceTests enforces it; see
# "Before tagging" in docs/ops/release.md), and a Blueprint with auto-sync on
# picks up the new version on its own.
#
# Security__CredentialEncryptionKey is generated for you (base64, 256-bit —
# matches `openssl rand -base64 32`). Keep it: losing it makes every stored
# mailbox credential undecryptable.
#
# PORT tells Render which port to probe — its default expectation is 10000,
# and Docker-image auto-detection is only "usually" reliable per Render's own
# docs. The container binds 8080 (see the Dockerfile's EXPOSE), regardless of
# this variable's value — the app itself does not read PORT.

databases:
  - name: dmarc-analyzer-db
    databaseName: dmarc_analyzer
    plan: free
    postgresMajorVersion: "18"

services:
  - name: dmarc-analyzer
    type: web
    runtime: image
    image:
      url: ghcr.io/dmarc-analyzer-net/dmarc-analyzer:0.7.0
    plan: free
    healthCheckPath: /api/v1/auth/setup
    envVars:
      - key: PORT
        value: "8080"
      - key: APP_MODE
        value: all
      - key: Database__MigrateOnStartup
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: dmarc-analyzer-db
          property: connectionString
      - key: Security__CredentialEncryptionKey
        generateValue: true
