# DMARC Analyzer — development stack (local build, dev Zitadel for OIDC).
#
# One-time setup, because the mailbox-password encryption key must not live in
# this file. A key committed to a public repo protects nothing, and every clone
# would share it:
#
#   echo "DMARC_ENCRYPTION_KEY=$(openssl rand -base64 32)" > .env
#   docker compose up -d
#
# Compose refuses to start without it rather than falling back to storing
# mailbox passwords in plaintext. .env is gitignored. Keep the key once mailbox
# credentials exist — changing it makes every stored password undecryptable.
#
# For self-hosting a release rather than developing, use deploy/compose.yml.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: dmarc-analyzer-net:dev
    environment:
      APP_MODE: api
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=dmarc_analyzer;Username=postgres;Password=postgres
      Database__MigrateOnStartup: "true"
      Security__CredentialEncryptionKey: "${DMARC_ENCRYPTION_KEY:?DMARC_ENCRYPTION_KEY missing - run: echo \"DMARC_ENCRYPTION_KEY=$(openssl rand -base64 32)\" > .env}"
      # OIDC login is off by default so `docker compose up` is self-contained.
      # The dev Zitadel service below plus the host-run dev loop in
      # docs/ops/oidc-zitadel.md enable and exercise it.
      Auth__Oidc__Enabled: "false"
    ports:
      - "8080:8080"
    # Unauthenticated and DB-backed: a 200 means migrations have been applied,
    # which is what the worker waits for below.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v1/auth/setup > /dev/null"]
      interval: 3s
      timeout: 3s
      retries: 20
      # Kestrel does not listen until migrations finish, and a migration can carry a
      # multi-minute backfill — AddDmarcReportRecordRangeBegin rewrites 5.3M rows in
      # ~94s. Without a start period the 20 retries expire first, the API reports
      # unhealthy partway through a deploy, and the worker's gate below waits on it.
      start_period: 150s
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    image: dmarc-analyzer-net:dev
    environment:
      APP_MODE: worker
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=dmarc_analyzer;Username=postgres;Password=postgres
      Security__CredentialEncryptionKey: "${DMARC_ENCRYPTION_KEY:?DMARC_ENCRYPTION_KEY missing - run: echo \"DMARC_ENCRYPTION_KEY=$(openssl rand -base64 32)\" > .env}"
      Worker__ScheduleIntervalSeconds: 15
      Worker__MaxMessagesPerSync: 50
      Worker__MaxRetryAttempts: 3
      Worker__RetryBaseDelaySeconds: 2
      Worker__StaleRunTimeoutMinutes: 20
      Worker__SyncRunTimeoutMinutes: 10
    depends_on:
      api:
        condition: service_healthy

  # Dev-only identity provider for testing the OIDC login front door.
  # Console: http://localhost:8082/ui/console (zitadel-admin@zitadel.localhost / Password1!)
  # Setup guide: docs/ops/oidc-zitadel.md
  zitadel:
    image: ghcr.io/zitadel/zitadel:v2.65.1
    command: start-from-init --masterkey "84f3926e521bf337d69f76c0fd2769b8" --tlsMode disabled
    environment:
      ZITADEL_DATABASE_POSTGRES_HOST: postgres
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: "8082"
    ports:
      - "8082:8080"
    depends_on:
      - postgres

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dmarc_analyzer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # api/worker migrate on boot, so gate them on Postgres actually accepting
    # connections — without this the first `up` races and the API exits.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dmarc_analyzer"]
      interval: 3s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
