# DMARC Analyzer — development stack (local build, dev Zitadel, Keycloak and
# Authentik for OIDC; Authentik is behind `--profile authentik`).
#
# One-time setup, because the mailbox-password encryption key must not live in
# this file. A key committed to a public repo protects nothing, and every clone
# would share it:
#
#   echo "DMARC_ENCRYPTION_KEY=$(openssl rand -base64 32)" > .env
#   docker compose up -d
#
# Compose refuses to start without it rather than falling back to storing
# mailbox passwords in plaintext. .env is gitignored. Keep the key once mailbox
# credentials exist — changing it makes every stored password undecryptable.
#
# For self-hosting a release rather than developing, use deploy/compose.yml.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: dmarc-analyzer-net:dev
    environment:
      APP_MODE: api
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=dmarc_analyzer;Username=postgres;Password=postgres
      Database__MigrateOnStartup: "true"
      Security__CredentialEncryptionKey: "${DMARC_ENCRYPTION_KEY:?DMARC_ENCRYPTION_KEY missing - run: echo \"DMARC_ENCRYPTION_KEY=$(openssl rand -base64 32)\" > .env}"
      # OIDC login is off by default so `docker compose up` is self-contained.
      # The dev Zitadel service below plus the host-run dev loop in
      # docs/ops/oidc-zitadel.md enable and exercise it.
      Auth__Oidc__Enabled: "false"
    ports:
      - "8080:8080"
    # Unauthenticated and DB-backed: a 200 means migrations have been applied,
    # which is what the worker waits for below.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v1/auth/setup > /dev/null"]
      interval: 3s
      timeout: 3s
      retries: 20
      # Kestrel does not listen until migrations finish, and a migration can carry a
      # multi-minute backfill — AddDmarcReportRecordRangeBegin rewrites 5.3M rows in
      # ~94s. Without a start period the 20 retries expire first, the API reports
      # unhealthy partway through a deploy, and the worker's gate below waits on it.
      start_period: 150s
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    image: dmarc-analyzer-net:dev
    environment:
      APP_MODE: worker
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=dmarc_analyzer;Username=postgres;Password=postgres
      Security__CredentialEncryptionKey: "${DMARC_ENCRYPTION_KEY:?DMARC_ENCRYPTION_KEY missing - run: echo \"DMARC_ENCRYPTION_KEY=$(openssl rand -base64 32)\" > .env}"
      Worker__ScheduleIntervalSeconds: 15
      Worker__MaxRetryAttempts: 3
      Worker__RetryBaseDelaySeconds: 2
      Worker__StaleRunTimeoutMinutes: 20
      Worker__SyncRunTimeoutMinutes: 10
    depends_on:
      api:
        condition: service_healthy

  # Dev-only identity provider for testing the OIDC login front door.
  # Console: http://localhost:8082/ui/console (zitadel-admin@zitadel.localhost / Password1!)
  # Setup guide: docs/ops/oidc-zitadel.md
  #
  # v4, because v2.65.1 could not start against the Postgres 18 below: its
  # 34_add_cache_schema migration does CREATE UNLOGGED on a partitioned table,
  # which Postgres 18 refuses ("partitioned tables cannot be unlogged"). The
  # container crash-looped, so the OIDC path this stack exists to exercise was
  # broken for anyone who cloned the repo.
  #
  # Deliberately still one container, which is what the feature flag below buys.
  # v4 defaults to its login-v2 UI, and that ships as a *separate* container that
  # has to share an origin with the API — so taking the default means adding both
  # a login service and a reverse proxy to route /ui/v2/login. Without them the
  # console redirects to /ui/v2/login and gets a bare {"code":5,"Not Found"}: no
  # way to sign in at all. Turning LoginV2 off keeps v4's built-in login, and the
  # authorization-code flow behaves exactly as it did on v2.
  #
  # DEFAULTINSTANCE only applies on first init, so flipping this later does
  # nothing to an existing volume — the instance has to be recreated.
  #
  # Upstream will remove the built-in login eventually. When it does, this grows a
  # zitadel-login service and a proxy in front of both.
  zitadel:
    image: ghcr.io/zitadel/zitadel:v4.16.2
    command: start-from-init --masterkey "84f3926e521bf337d69f76c0fd2769b8" --tlsMode disabled
    environment:
      ZITADEL_DATABASE_POSTGRES_HOST: postgres
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: "8082"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "false"
    ports:
      - "8082:8080"
    depends_on:
      - postgres

  # A second dev-only identity provider, for testing against Keycloak
  # specifically rather than Zitadel. Console: http://localhost:8085
  # (admin / admin — bootstrapped fresh on first start). Setup guide:
  # docs/ops/oidc-keycloak.md
  #
  # No database wiring, on purpose — start-dev without KC_DB falls back to
  # Keycloak's own embedded dev store (an H2 file under /opt/keycloak/data,
  # kept by the volume below), so this needs no database created ahead of
  # time. Zitadel needs the zitadel database to exist first because it has no
  # such fallback; Keycloak's dev mode exists specifically to avoid that.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8085:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data

  # A third dev-only identity provider, for testing against Authentik.
  # Console: http://localhost:8086 (first start needs the initial-setup flow —
  # see docs/ops/oidc-authentik.md). Setup guide: docs/ops/oidc-authentik.md
  #
  # Behind a profile, unlike Zitadel and Keycloak, because this is three
  # containers rather than one and idles around a gigabyte of RAM. It only
  # starts when asked for:
  #
  #   docker compose --profile authentik up -d
  #
  # Its own database, not the postgres service below: Authentik's migrations
  # want to own the whole database (they install cache and channels tables of
  # their own, see below) and it needs a schema created ahead of time either
  # way. A separate container costs nothing here and keeps the app's database
  # free of 70-odd authentik_* tables.
  #
  # No Redis, which every upstream example still includes. As of 2026.x
  # Authentik keeps its cache and channel layers in Postgres — the migration
  # log shows django_postgres_cache and django_channels_postgres — so the
  # broker is gone and server+worker+db is the whole stack. Do not copy a
  # Redis service back in from upstream docs without checking it is needed.
  authentik-postgres:
    image: postgres:18-alpine
    profiles: ["authentik"]
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: authentik
      # Same reasoning as the app's postgres service below.
      PGDATA: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik -d authentik"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - authentik_postgres_data:/var/lib/postgresql/data

  authentik-server:
    image: ghcr.io/goauthentik/server:2026.5.6
    command: server
    profiles: ["authentik"]
    environment: &authentik-env
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: authentik
      # Dev-only, like Zitadel's masterkey above. Signs sessions and tokens for
      # a throwaway local instance; generate a real one for any real install.
      AUTHENTIK_SECRET_KEY: dev-only-authentik-secret-key-not-for-real-use
      # Seeds the akadmin account, the equivalent of Keycloak's
      # KC_BOOTSTRAP_ADMIN_* above. Without these a fresh instance has an
      # akadmin with no usable password and the sign-in page does not say so —
      # you have to find /if/flow/initial-setup/ and invent one. Setting them
      # keeps `up` to a single step and makes the credential the same for
      # everyone who clones this.
      AUTHENTIK_BOOTSTRAP_EMAIL: akadmin@example.com
      AUTHENTIK_BOOTSTRAP_PASSWORD: admin
    ports:
      - "8086:9000"
    # Authentik's own compose sets this; its workers mmap enough that the
    # default 64MB /dev/shm is not always enough.
    shm_size: 512mb
    depends_on:
      authentik-postgres:
        condition: service_healthy

  # Required, not optional. Authentik puts scheduled work and blueprint
  # application here, and either container may end up running the migrations —
  # both try on boot and a database lock decides which one does it.
  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.5.6
    command: worker
    profiles: ["authentik"]
    environment: *authentik-env
    shm_size: 512mb
    depends_on:
      authentik-postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: dmarc_analyzer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # Pinned rather than inherited. The postgres image moved its default PGDATA in
      # 18 (to /var/lib/postgresql/18/docker) and moved the declared VOLUME with it,
      # so an image built on that default would stop looking where this volume keeps
      # the cluster — and, finding nothing, would initdb an empty one and start up
      # healthy. Naming the path makes a major-version change fail loudly with
      # "database files are incompatible with server" instead of silently serving an
      # empty database. Set to where the data already is; pointing it at a
      # subdirectory would orphan every existing volume.
      PGDATA: /var/lib/postgresql/data
    # api/worker migrate on boot, so gate them on Postgres actually accepting
    # connections — without this the first `up` races and the API exits.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dmarc_analyzer"]
      interval: 3s
      timeout: 3s
      retries: 10
    # Bound to the loopback interface, not every interface. Local tooling (psql, a
    # GUI client, the host-run dev loop) is unaffected; other machines on the network
    # can no longer reach the database. That matters here because the credentials are
    # committed two lines above — publishing 5432:5432 put a postgres/postgres
    # database on the LAN of anyone who ran this file. The shipped deploy/compose.yml
    # never published the port at all; only this development stack did.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  keycloak_data:
  authentik_postgres_data:
